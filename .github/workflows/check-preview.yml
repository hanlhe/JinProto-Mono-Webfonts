name: Check live preview

on:
  push:
    branches: [main]
    paths: [".github/workflows/check-preview.yml", ".github/scripts/check-preview.mjs"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check the deployed page in Chrome
        run: node .github/scripts/check-preview.mjs
      - name: Save screenshots and results on a separate branch
        run: |
          git checkout --orphan "page-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git rm -r --cached .
          cp "$RUNNER_TEMP/jinproto-live-check/report.json" .
          for image in desktop mobile; do
            if [ -f "$RUNNER_TEMP/jinproto-live-check/$image.png" ]; then
              cp "$RUNNER_TEMP/jinproto-live-check/$image.png" .
              git add "$image.png"
            fi
          done
          git add report.json
          git config user.name "Hanlin He"
          git config user.email "hanling.he@gmail.com"
          git -c commit.gpgsign=false commit -m "Record live preview checks"
          git push origin "HEAD:refs/heads/page-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Require the browser checks to pass
        run: node -e 'if (!JSON.parse(require("node:fs").readFileSync("report.json")).ok) process.exit(1)'
