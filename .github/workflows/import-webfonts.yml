name: Import webfonts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Decode reviewed webfonts
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for style in ('Regular', 'Bold'):
              name = f'JinProtoMono-{style}.woff2'
              parts = sorted(Path('.bootstrap').glob(name + '.b64.*'))
              assert parts, name
              encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
              Path(name).write_bytes(base64.b64decode(encoded, validate=True))
          PY
          sha256sum -c SHA256SUMS
      - name: Publish native webfont files
        run: |
          git config user.name "Hanlin He"
          git config user.email "hanling.he@gmail.com"
          git add JinProtoMono-Regular.woff2 JinProtoMono-Bold.woff2
          git rm -r .bootstrap
          git -c commit.gpgsign=false commit -m "Publish webfont files"
          git push origin HEAD:main
